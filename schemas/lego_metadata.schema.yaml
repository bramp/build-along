$defs:
  Dimensions:
    description: Dimensions of the assembled LEGO model in centimeters.
    properties:
      height:
        anyOf:
        - type: number
        - type: 'null'
        default: null
        description: Height in centimeters.
        title: Height
      width:
        anyOf:
        - type: number
        - type: 'null'
        default: null
        description: Width in centimeters.
        title: Width
      depth:
        anyOf:
        - type: number
        - type: 'null'
        default: null
        description: Depth in centimeters.
        title: Depth
    title: Dimensions
    type: object
  ImageEntry:
    description: Represents a product image or asset from LEGO.com.
    properties:
      id:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: The asset identifier.
        title: Id
      url:
        description: The URL to the image.
        format: uri
        minLength: 1
        title: Url
        type: string
      alt_text:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: Alt text or description of the image.
        title: Alt Text
    required:
    - url
    title: ImageEntry
    type: object
  PdfEntry:
    description: 'Represents a single instruction PDF file.


      This model is serialized to JSON as part of InstructionMetadata and is

      used by both Python and other applications (via generated schemas).'
    properties:
      url:
        description: The URL to the PDF file.
        format: uri
        minLength: 1
        title: Url
        type: string
      filename:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: The suggested filename for the PDF.
        title: Filename
      filesize:
        anyOf:
        - type: integer
        - type: 'null'
        default: null
        description: The size of the PDF file in bytes.
        title: Filesize
      filehash:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: SHA256 hash of the PDF file content, if available.
        title: Filehash
      preview_url:
        anyOf:
        - format: uri
          minLength: 1
          type: string
        - type: 'null'
        default: null
        description: An optional URL for a preview image of the PDF.
        title: Preview Url
      is_additional_info_booklet:
        anyOf:
        - type: boolean
        - type: 'null'
        default: null
        description: Indicates if the PDF is an additional info booklet rather than the main
          instructions.
        title: Is Additional Info Booklet
      sequence_number:
        anyOf:
        - type: integer
        - type: 'null'
        default: null
        description: The sequence number of the PDF in a multi-part instruction set (e.g.,
          1 for 1/4).
        title: Sequence Number
      sequence_total:
        anyOf:
        - type: integer
        - type: 'null'
        default: null
        description: The total number of PDFs in a multi-part instruction set (e.g., 4 for
          1/4).
        title: Sequence Total
      preview_alt:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: The alt text for the preview cover image, if available.
        title: Preview Alt
    required:
    - url
    title: PdfEntry
    type: object
  VideoEntry:
    description: Represents a product video from LEGO.com.
    properties:
      id:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: The video asset identifier.
        title: Id
      title:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: The video title.
        title: Title
      description:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: The video description.
        title: Description
      url:
        anyOf:
        - format: uri
          minLength: 1
          type: string
        - type: 'null'
        default: null
        description: The URL to the video file, if available.
        title: Url
      quality:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: The video stream quality (e.g., 'Highest').
        title: Quality
    title: VideoEntry
    type: object
description: JSON Schema for LEGO set metadata, generated from Pydantic models. This schema
  describes the structure of metadata.json files containing information about LEGO sets and
  their instruction PDFs.
properties:
  set:
    description: The unique identifier for the LEGO set.
    title: Set
    type: string
  locale:
    description: The locale for the instructions (e.g., "en-US").
    title: Locale
    type: string
  name:
    anyOf:
    - type: string
    - type: 'null'
    default: null
    description: The name of the LEGO set.
    title: Name
  theme:
    anyOf:
    - type: string
    - type: 'null'
    default: null
    description: The theme of the LEGO set (e.g., "City", "Star Wars").
    title: Theme
  age:
    anyOf:
    - type: string
    - type: 'null'
    default: null
    description: The recommended age range for the set.
    title: Age
  pieces:
    anyOf:
    - type: integer
    - type: 'null'
    default: null
    description: The number of pieces in the set.
    title: Pieces
  year:
    anyOf:
    - type: integer
    - type: 'null'
    default: null
    description: The year the set was released.
    title: Year
  set_image_url:
    anyOf:
    - format: uri
      minLength: 1
      type: string
    - type: 'null'
    default: null
    description: URL to an image of the LEGO set.
    title: Set Image Url
  set_image_alt:
    anyOf:
    - type: string
    - type: 'null'
    default: null
    description: Alt text for the image of the LEGO set.
    title: Set Image Alt
  description:
    anyOf:
    - type: string
    - type: 'null'
    default: null
    description: The product description for the LEGO set.
    title: Description
  features_text:
    anyOf:
    - type: string
    - type: 'null'
    default: null
    description: The features and details text (including dimensions and highlights).
    title: Features Text
  meta_description:
    anyOf:
    - type: string
    - type: 'null'
    default: null
    description: A short summary description of the set.
    title: Meta Description
  meta_title:
    anyOf:
    - type: string
    - type: 'null'
    default: null
    description: The meta title of the set product page.
    title: Meta Title
  slug:
    anyOf:
    - type: string
    - type: 'null'
    default: null
    description: The URL slug of the set on LEGO.com.
    title: Slug
  hires_image_url:
    anyOf:
    - format: uri
      minLength: 1
      type: string
    - type: 'null'
    default: null
    description: URL to a high-resolution image of the LEGO set.
    title: Hires Image Url
  thumbnail_image_url:
    anyOf:
    - format: uri
      minLength: 1
      type: string
    - type: 'null'
    default: null
    description: URL to a thumbnail image of the LEGO set.
    title: Thumbnail Image Url
  images:
    default: []
    description: List of all product and gallery images available for the set.
    items:
      $ref: '#/$defs/ImageEntry'
    title: Images
    type: array
  videos:
    default: []
    description: List of all product videos available for the set.
    items:
      $ref: '#/$defs/VideoEntry'
    title: Videos
    type: array
  categories:
    default: []
    description: Categories or tags associated with the set.
    items:
      type: string
    title: Categories
    type: array
  brand:
    anyOf:
    - type: string
    - type: 'null'
    default: null
    description: The brand category of the set (e.g., 'Star Wars', 'Icons').
    title: Brand
  minifigure_count:
    anyOf:
    - type: integer
    - type: 'null'
    default: null
    description: The number of minifigures included in the set.
    title: Minifigure Count
  dimensions:
    anyOf:
    - $ref: '#/$defs/Dimensions'
    - type: 'null'
    default: null
    description: Dimensions of the assembled set in centimeters.
  availability_status:
    anyOf:
    - type: string
    - type: 'null'
    default: null
    description: Availability status on LEGO.com (e.g. 'E_AVAILABLE', 'R_RETIRED').
    title: Availability Status
  availability_text:
    anyOf:
    - type: string
    - type: 'null'
    default: null
    description: Human-readable availability text (e.g. 'Available now', 'Retired product').
    title: Availability Text
  price_formatted:
    anyOf:
    - type: string
    - type: 'null'
    default: null
    description: Formatted price (e.g. '$999.99').
    title: Price Formatted
  price_cents:
    anyOf:
    - type: integer
    - type: 'null'
    default: null
    description: Price in cents.
    title: Price Cents
  currency:
    anyOf:
    - type: string
    - type: 'null'
    default: null
    description: Currency code (e.g. 'USD').
    title: Currency
  rating:
    anyOf:
    - type: number
    - type: 'null'
    default: null
    description: Average customer review rating out of 5.
    title: Rating
  sku:
    anyOf:
    - type: string
    - type: 'null'
    default: null
    description: The LEGO shop item/SKU number.
    title: Sku
  flags:
    default: []
    description: Special badges or flags (e.g. 'Exclusives', 'New').
    items:
      type: string
    title: Flags
    type: array
  pdfs:
    default: []
    description: A list of PDF instruction entries for the set.
    items:
      $ref: '#/$defs/PdfEntry'
    title: Pdfs
    type: array
required:
- set
- locale
title: LEGO Set Metadata Schema
type: object
$schema: https://json-schema.org/draft/2020-12/schema
